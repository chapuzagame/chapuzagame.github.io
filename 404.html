<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta caña no está · Page not found · Chapuza Game</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/chapuza-favicon.ico" sizes="48x48">
<link rel="icon" href="/img/chapuza-icon-192.png" type="image/png" sizes="192x192">
<style>
  /* la página de «no existe» (GitHub Pages la sirve para cualquier dirección que no esté): la pizarra del bar, con las
     direcciones desde la raíz porque puede salir a cualquier profundidad */
  :root { --board: #1f2a24; --chalk: #f1ead8; --dim: #b8b09b; --beer: #ffb300; --ink: #2a160b; --wall: #4a1c12; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; background: radial-gradient(circle at 50% 30%, var(--wall), #22100b);
    color: var(--chalk); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { width: 100%; max-width: 520px; padding: 32px 22px; border-radius: 18px; background: var(--board); box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  img { width: 96px; height: auto; }
  h1 { margin: 12px 0 6px; font-size: 26px; color: var(--beer); }
  p { margin: 0 0 6px; } .en { color: var(--dim); }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
  a { display: inline-block; padding: 10px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  a.go { background: var(--beer); color: var(--ink); } a.home { border: 1.5px solid var(--dim); color: var(--chalk); }
</style>
</head>
<body>
<main>
  <img src="/img/chapuza-icon-192.png" alt="Chapuza Game" width="192" height="192">
  <h1>Esta caña no está</h1>
  <p>La página que buscas no existe (o se la ha bebido alguien).</p>
  <p class="en" lang="en">This page doesn't exist (or someone drank it).</p>
  <nav>
    <a class="go" href="/how-to-pour-beer/">Jugar a la demo · Play</a>
    <a class="home" href="/">Ir a la portada · Home</a>
  </nav>
</main>
</body>
</html>
