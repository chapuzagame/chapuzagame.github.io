<!-- sin «de dónde vienes»: quien la escribe a mano viene de un vídeo, no de esta página -->
<meta name="referrer" content="no-referrer">
<style>html { background: #22100b; }</style>
<script>
  // chapuzagame.github.io/tt, la dirección corta que sale escrita al final de los TikTok (allí los enlaces no se pueden
  // pulsar): lleva a la portada en español como un enlace con ?de=tt, y origen.js apunta allí el origen «tiktok». Se
  // queda con lo demás que traiga (?p=…, #…). Esta página no carga Umami ni origen.js, así que no cuenta como visita.
  // Vale con barra final y sin ella (/tt, /tt/ o /tt/index.html).
  (function () {
    var DE = 'tt', A = '';                     // A: la página de destino, desde la raíz de la web ('' la portada, 'en/' la inglesa)
    var q = new URLSearchParams(location.search);
    q.delete('de');
    var resto = q.toString();
    var raiz = location.pathname.replace(/\/(index\.html)?$/, '').replace(/[^/]*$/, '');
    location.replace(raiz + A + '?de=' + DE + (resto ? '&' + resto : '') + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../?de=tt"></noscript>
